version: '3.8'

services:
  app:
    build: .
    container_name: php-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=person
    depends_on:
      - db
    networks:
      - project-network

  db:
    image: mariadb:10.11
    container_name: my-mysql
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=person
    volumes:
      - db_data:/var/lib/mysql
      - ./person.sql:/docker-entrypoint-initdb.d/person.sql:ro
    ports:
      - "3306:3306"
    networks:
      - project-network

  phpmyadmin:
    image: phpmyadmin
    container_name: my-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=root
    depends_on:
      - db
    networks:
      - project-network

networks:
  project-network:
    driver: bridge

volumes:
  db_data:
